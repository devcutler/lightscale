name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/frontend/pnpm-lock.yaml

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
          cache-dependency-path: go.sum

      - name: Build web UI
        working-directory: web/frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Build binaries
        env:
          GOOS: linux
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            GOARCH=$arch go build -trimpath -ldflags "-s -w" -o "dist/lightscaled-linux-$arch" ./daemon
            GOARCH=$arch go build -trimpath -ldflags "-s -w" -o "dist/lightscale-linux-$arch" ./cli
          done

      - name: Checksums
        working-directory: dist
        run: sha256sum lightscale* > checksums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/lightscaled-linux-amd64
            dist/lightscale-linux-amd64
            dist/lightscaled-linux-arm64
            dist/lightscale-linux-arm64
            dist/checksums.txt
            deploy/lightscaled.service
            deploy/install.sh
          generate_release_notes: true
